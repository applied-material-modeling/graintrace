[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graintrace"
version = "0.1.2"
description = "Crystal plasticity FE pipeline for APS HEDM experiments"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Applied Material Modeling, Argonne National Laboratory" },
]
keywords = [
    "crystal-plasticity",
    "finite-element",
    "HEDM",
    "microstructure",
    "MOOSE",
    "NEML2",
    "materials-science",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Operating System :: POSIX :: Linux",
]

# Runtime deps. The compiled/licensed native stack (NEML2, MOOSE/PUMA, CUBIT,
# NEPER, libtorch) is provided by the PUMA build, not by pip: PUMA builds NEML2
# from its pinned submodule (ABI-matched to `puma-opt`), so a PyPI NEML2 wheel is
# not used. `__init__` lazy-imports NEML2, so bare `pip install graintrace` runs
# the pure-Python features (post-processing, REI, stitching); NEML2-using features
# (calibration, pole figures, CPFE) need the PUMA-built NEML2. See README.
# pyzag IS a pip dependency: it is pure-Python, ships on PyPI, and is the
# applied-material-modeling 2.0.0 build that NEML2 v3 requires.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "torch>=2.0",
    "networkx>=3.0",
    "networkit",
    "tqdm",
    "pyvista>=0.40",
    "vtk>=9.0",
    "scikit-learn>=1.3",
    "numba>=0.59",
    "gmsh>=4.12",
    "multiprocess",
    "pyzag==2.0.0",
]

[project.optional-dependencies]
# Grain-graph / GNN utilities (grain_graph_matching, tess_to_gnn).
gnn = ["torch-geometric>=2.3"]
# MCP server (graintrace.mcp) -- drive graintrace from any MCP client
# (Claude Desktop / Claude Code, or any other MCP client).
mcp = ["mcp[cli]>=1.2"]
# Extra deps used by the example scripts under examples/.
examples = ["meshio>=5.0"]
# Documentation build (Sphinx). Mirrors the pyzag project's docs toolchain.
# The compiled stack is mocked at build time (see docs/conf.py autodoc_mock_imports),
# so the docs build needs none of NEML2/MOOSE/NEPER/CUBIT.
docs = [
    "sphinx>=7.0",
    "pydata-sphinx-theme>=0.15",
    "nbsphinx>=0.9",
    "ipython",
    "ipykernel",
    "sphinx-copybutton>=0.5",
    "sphinx-design>=0.5",
]
dev = ["pytest", "pytest-cov", "black==24.3.0", "isort", "pylint", "build", "twine"]

[project.scripts]
graintrace-mcp = "graintrace.mcp.server:main"

[project.urls]
Homepage = "https://github.com/applied-material-modeling/graintrace"
Repository = "https://github.com/applied-material-modeling/graintrace"
Issues = "https://github.com/applied-material-modeling/graintrace/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["graintrace*"]

[tool.setuptools.package-data]
graintrace = ["cpfe_base/*.i", "mcp/recipes/*.md", "mcp/tools.example.json"]
