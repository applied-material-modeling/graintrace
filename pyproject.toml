[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graintrace"
version = "0.1.0"
description = "Crystal plasticity FE pipeline for APS HEDM experiments"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Applied Material Modeling, Argonne National Laboratory" },
]
keywords = [
    "crystal-plasticity",
    "finite-element",
    "HEDM",
    "microstructure",
    "MOOSE",
    "NEML2",
    "materials-science",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Operating System :: POSIX :: Linux",
]

# Only pip-installable, pure-Python runtime deps actually imported by the
# `graintrace` package are listed here. The compiled/licensed stack it drives at
# runtime -- neml2, pyzag, MOOSE/PUMA (puma-opt), CUBIT/SCULPT, NEPER, libtorch --
# is NOT on PyPI and is provided via the pinned git submodules under `external/`
# (see README + PUBLISHING.md). `pip install graintrace` gives you the Python
# code and its Python deps; it does not build that external stack.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "torch>=2.0",
    "networkx>=3.0",
    "networkit",
    "tqdm",
    "pyvista>=0.40",
    "vtk>=9.0",
    "scikit-learn>=1.3",
    "numba>=0.59",
    "gmsh>=4.12",
    "multiprocess",
]

[project.optional-dependencies]
# Grain-graph / GNN utilities (grain_graph_matching, tess_to_gnn).
gnn = ["torch-geometric>=2.3"]
# MCP server (graintrace.mcp) -- drive graintrace from any MCP client
# (Claude Desktop/Code, or Open WebUI via the mcpo proxy).
mcp = ["mcp[cli]>=1.2"]
# Extra deps used by the example scripts under examples/.
examples = ["meshio>=5.0"]
dev = ["pytest", "black", "isort", "build", "twine"]

[project.scripts]
graintrace-mcp = "graintrace.mcp.server:main"

[project.urls]
Homepage = "https://github.com/applied-material-modeling/graintrace"
Repository = "https://github.com/applied-material-modeling/graintrace"
Issues = "https://github.com/applied-material-modeling/graintrace/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["graintrace*"]

[tool.setuptools.package-data]
graintrace = ["cpfe_base/*.i", "mcp/recipes/*.md"]
