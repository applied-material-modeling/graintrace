# Lint + format gate (mirrors the pyzag project's formatting_check workflow).
# neml2 / pyzag / torch_geometric are not pip-installable here; .pylintrc lists them
# under ignored-modules so pylint does not raise import-error on the lazy imports.
name: Check code formatting
on: [push, pull_request]
jobs:
  check-formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ".[dev]"
      - run: pylint --rcfile=.pylintrc graintrace
      - run: black --check graintrace tests
