# Build the Sphinx documentation and deploy it to GitHub Pages using GitHub's
# official Pages deployment (actions/deploy-pages). This uses only GitHub-authored
# actions and needs only `pages: write` + `id-token: write` (OIDC) — not
# `contents: write` — so it works under org policies that restrict third-party
# actions or lock the default workflow-token permission to read-only.
#
# Pages source must be set to "GitHub Actions" (Settings -> Pages -> Source).
#
# The docs build needs NONE of the compiled stack: docs/conf.py mocks
# NEML2/MOOSE/NEPER/CUBIT via autodoc_mock_imports.
name: Documentation

on:
  push:
    branches: [main, documentation]
  pull_request:
    branches: [main, documentation]
  workflow_dispatch:

# OIDC-based Pages deploy: no contents:write needed.
permissions:
  contents: read
  pages: write
  id-token: write

# Serialize Pages deploys; don't cancel an in-progress production deploy.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # pandoc + TeX: nbsphinx notebook conversion and imgmath equation rendering.
      - run: sudo apt-get update && sudo apt-get install -y pandoc texlive-latex-recommended texlive-latex-extra dvipng
      - run: pip install ".[docs]"
      # Strict HTML build: warnings are errors (catches broken refs / import failures).
      - run: sphinx-build -W --keep-going -b html docs docs/_build/html
      # Doc tests: runnable snippets (sphinx.ext.doctest) gate the build.
      - run: make -C docs doctest
      # Link checking is informational: external links flake / rate-limit.
      - run: make -C docs linkcheck
        continue-on-error: true
      # Downloadable on every run (any branch/PR), so the site can be reviewed
      # without deploying to Pages.
      - name: Upload built HTML artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html
      # Pages artifact, consumed by the deploy job (main only).
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  # Deploy to GitHub Pages, only from main.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
